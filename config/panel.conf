# Portable defaults. Use --config or SLIVERBAR_CONFIG to select this file.
font=JetBrainsMono:style=Regular:size=13
# Optional; Pango falls back to available system fonts when this family is absent.
icon_font=Hack Nerd Font Mono:style=Regular:size=13
wm_name=sliverbar
monitor=primary
workspace_backend=auto
application_launcher=auto
power_menu_mode=auto
# Ordered subset of lock,suspend,hibernate,suspend_then_hibernate,
# hybrid_sleep,reboot,poweroff. Empty disables all internal actions.
power_actions=lock,suspend,hibernate,suspend_then_hibernate,hybrid_sleep,reboot,poweroff
power_confirm=suspend,hibernate,suspend_then_hibernate,hybrid_sleep,reboot,poweroff
height=25
clickable_areas=30
underline=0
terminal=auto
system_monitor=auto
network_settings=auto
volume_settings=auto
calendar=auto
# Audio file played after a timer reaches zero.
timer_sound=/usr/share/sounds/freedesktop/stereo/alarm-clock-elapsed.oga
# Overrides accept desktop:ID.desktop, command:PROGRAM ARGUMENTS, or
# terminal:PROGRAM ARGUMENTS.
# launcher=desktop:example.desktop
# power_menu=command:example-power-menu
# Weather remains hidden until a location is configured.
location=
# Repeat weather_location up to four times: safe-id|label|query.
# weather_location=munich|München|Munich
# weather_location=berlin|Berlin|Berlin
# weather_default=munich
language=auto
module_clock=auto
module_title=auto
module_cpu=auto
module_battery=auto
module_screencast=auto
module_volume=auto
module_network=auto
module_brightness=auto
module_weather=auto
module_launcher=auto
module_tray=auto
module_power=auto
module_inhibitor=auto
module_timer=auto
volume_step=1
brightness_step=1
# Seconds; values outside 1800-14400 are clamped and logged as warnings.
weather_interval=1800
network_interval=60
title_max=45
color_panel_bg=#191A21
color_bg=#282A36
color_fg=#ff5555
color_free=#bfbfbf
color_focus=#69FF94
color_free_bg=#191A21
color_focused_free=#50fa7b
color_focused_free_bg=#21222C
color_occupied=#ff5555
color_occupied_bg=#191A21
color_focused_occupied=#69FF94
color_focused_occupied_bg=#191A21
color_urgent=#FF6E6E
color_urgent_bg=#343746
color_focused_urgent=#343746
color_focused_urgent_bg=#FF6E6E
color_clock=#50fa7b
color_volume=#ff79c6
color_muted=#ff5555
color_system=#f1fa8c
color_network=#8be9fd
color_weather=#bd93f9
color_battery=#ffb86c
color_warning=#f1fa8c
color_critical=#ff5555
color_brightness=#bd93f9
